<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Garden</title>
<style>
  html, body { margin: 0; height: 100%; background: #E2DAC5; }
  #clear-garden {
    all: unset; position: fixed; top: 14px; right: 16px; z-index: 1; cursor: pointer;
    font: 400 15px/1.25 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .04em; text-transform: uppercase;
    color: #013148; opacity: .45; transition: opacity .15s;
  }
  #clear-garden:hover { opacity: 1; }
  #clear-garden:focus-visible { outline: 1px dashed #013148; outline-offset: 3px; }
  #garden-hint {
    position: fixed; top: 16px; left: 16px; z-index: 1; margin: 0; pointer-events: none;
    font: 400 12px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .04em; text-transform: uppercase;
    color: #013148; opacity: .7; transition: opacity .6s;
  }
  #garden-hint.hidden { opacity: 0; }
</style>
</head>
<body>
<button id="clear-garden" type="button" aria-label="Clear the garden"
        onclick="document.querySelector('pixel-garden').clear()">clear garden</button>
<p id="garden-hint">click to start watering</p>
<pixel-garden fill avoid="#clear-garden"></pixel-garden>
<script>
/*
 * <pixel-garden> — click to water, a pixel flower grows.
 * Inside the element the cursor becomes a watering can.
 *
 * Attributes (all optional):
 *   pixel-size   size of one art pixel in CSS px (default 4)
 *   ink          line colour   (default #013148)
 *   paper        background    (default #E2DAC5)
 *   max-flowers  oldest flowers are removed past this (default 60)
 *   fill         fill the parent's height (use this in Framer / site-builder embeds)
 * Flowers that wouldn't fit fully inside the box aren't planted or grown.
 * More than 3 flowers brings butterflies; more than 4, the odd worm;
 * more than 5, a bunny.
 *
 * Tools (toolbar in the top-left corner, or set the mode attribute / .mode property):
 *   water      plant new flowers and grow existing ones
 *   interact   brush flowers to make them sway; touch a butterfly, bunny or worm
 *              and it runs off (the bunny burrows and comes back later)
 *   dig        click a flower to dig it up
 *   mode="interact"  start in that mode       no-tools  hide the toolbar
 *   avoid="#a, .b"  page elements (CSS selectors) flowers mustn't grow over
 * Watering an existing flower makes it grow bigger (up to 5 times).
 * Call gardenElement.clear() to clear it from your own code.
 * Set the size with CSS, e.g. style="height: 420px" (width fills its container).
 */
(() => {
  if (customElements.get('pixel-garden')) return;

  // ---------- watering can sprite ('#' ink, 'o' paper, ':' dithered, ' ' clear)
  const CAN = [
    '        #####  ',
    '       #     # ',
    '       #     # ',
    ' #    #########',
    '###   #ooooooo#',
    '##o#  #ooooooo#',
    '###o# #ooooooo#',
    ' # #o##ooooooo#',
    '    #o#:::::::#',
    '     ##:::::::#',
    '      #########',
  ];
  const CAN_POUR_ROWS = [
    '        #####  ',
    '       #     # ',
    '       #     # ',
    '      #########',
    '      #ooooooo#',
    '      #ooooooo#',
    '      #ooooooo#',
    '     ##ooooooo#',
    '    #o#:::::::#',
    '   #o##:::::::#',
    '  #o# #########',
    '####           ',
    ' # #           ',
  ];
  const sprite = (rows, tip, lift) => {
    const cells = [];
    rows.forEach((r, y) => [...r].forEach((c, x) => c !== ' ' && cells.push({ x, y, c })));
    return { cells, tip, lift };
  };
  // lift = how many cells above the landing spot the spout sits
  const CAN_IDLE = sprite(CAN, { x: 0, y: 6 }, 9);
  const CAN_POUR = sprite(CAN_POUR_ROWS, { x: 1, y: 12 }, 4);

  const clamp01 = t => Math.max(0, Math.min(1, t));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => { const c = 1.6; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };
  const rand = (a, b) => a + Math.random() * (b - a);

  const FLOWER_SCALE = 0.8;   // overall flower size
  const GROW_MS = 1700, GROW_DELAY = 260, GROW_MORE_MS = 800, MAX_LEVEL = 5;

  // ---------- critters
  const BF_OPEN = [
    '    # #    ',
    '###  #  ###',
    '#::# # #::#',
    '#:::###:::#',
    ' #::###::# ',
    '  #:###:#  ',
    '  ## # ##  ',
  ];
  const BF_SHUT = [
    '    # #    ',
    '  ## # ##  ',
    '  #:###:#  ',
    '  #::#::#  ',
    '   #:#:#   ',
    '   #:#:#   ',
    '    ###    ',
  ];
  // bunny: filled silhouette ('e' = paper details)
  const BUNNY_SIT = [
    '         #   #   ',
    '        #e# #e#  ',
    '        #e# #e#  ',
    '        #e# #e#  ',
    '        ### ###  ',
    '       ######### ',
    '      ######e####',
    '   ############# ',
    '  #############  ',
    ' ##############  ',
    '##e###########   ',
    '##e######e###    ',
    ' ####eeee##e#    ',
    '  #########e##   ',
    '   ###########   ',
  ];
  const BUNNY_NIB = [
    '         #   #   ',
    '        #e# #e#  ',
    '        #e# #e#  ',
    '        ### ###  ',
    '   ############  ',
    '  #############  ',
    ' ################ ',
    '############e####',
    '##e##############',
    '##e######e###### ',
    ' ####eeee##e##   ',
    '  #########e##   ',
    '   ###########   ',
  ];
  const BUNNY_HOP = [
    '          #   #    ',
    '         #e# #e#   ',
    '        #e# #e#    ',
    '        ### ###    ',
    '        #########  ',
    '    ##########e### ',
    '  ##############   ',
    ' ###############   ',
    '##e############    ',
    '##e######e#####    ',
    ' ####eeee##e###    ',
    '##########  #e##   ',
    '###            ##  ',
  ];
  // cursors for the other tools ('o' = paper)
  const HAND = [
    ' #     ',
    '#o#    ',
    '#o###  ',
    '#o#o## ',
    '#ooooo#',
    '#ooooo#',
    ' #ooo# ',
    '  ###  ',
  ];
  const TROWEL = [
    '           ## ',
    '          #oo#',
    '         #oo# ',
    '        #oo#  ',
    '       ###    ',
    '   #####      ',
    '  #ooo#       ',
    ' #ooo##       ',
    '#ooo#:#       ',
    '#oo#::#       ',
    '#o#::#        ',
    '###:#         ',
    '####          ',
  ];
  const BUTTERFLIES_AFTER = 3, MAX_BUTTERFLIES = 3, WORMS_AFTER = 4, BUNNIES_AFTER = 5, MAX_BUNNIES = 1;
  const BUNNY_W = 19, BUNNY_H = 15, HOP_MS = 300, HOP_LEN = 6, HOP_ARC = 1.5, BURROW_MS = 900, DIG_MS = 520;
  const MODES = ['water', 'interact', 'dig'];

  class PixelGarden extends HTMLElement {
    connectedCallback() {
      if (this._init) return;
      this._init = true;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `<style>
        :host{display:block;position:relative;width:100%;height:320px;cursor:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
        canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
        :host([fill]){height:100%;min-height:200px}
        .tools{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:6px;z-index:1;margin:0;padding:0;list-style:none}
        :host([no-tools]) .tools{display:none}
        button{all:unset;cursor:pointer;display:block;white-space:pre;
          font:400 15px/1.25 ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.04em;text-transform:uppercase;
          color:var(--ink);opacity:.45;transition:opacity .15s}
        button::before{content:'  '}
        button[aria-pressed="true"]{opacity:1}
        button[aria-pressed="true"]::before{content:'> '}
        button:hover{opacity:.8}
        button[aria-pressed="true"]:hover{opacity:1}
        button:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
      </style><canvas></canvas>
      <div class="tools" role="toolbar" aria-label="Garden tools" aria-orientation="vertical">
        <button type="button" data-mode="interact">interact</button>
        <button type="button" data-mode="water">water</button>
        <button type="button" data-mode="dig">dig</button>
      </div>`;
      this.canvas = root.querySelector('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.ink = this.getAttribute('ink') || '#013148';
      this.paper = this.getAttribute('paper') || '#E2DAC5';
      this.px = +this.getAttribute('pixel-size') || 4;
      this.maxFlowers = +this.getAttribute('max-flowers') || 60;
      // inside an embed iframe, let the page itself fill the frame
      if (this.hasAttribute('fill') && window.self !== window.top && this.parentElement === document.body) {
        document.documentElement.style.height = document.body.style.height = '100%';
        document.body.style.margin = '0';
      }
      this.style.setProperty('--ink', this.ink);
      this.style.setProperty('--paper', this.paper);
      this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      this.plants = [];
      this.drops = [];
      this.splashes = [];
      this.pointer = null;
      this.pourUntil = 0;
      this.butterflies = [];
      this.bunnies = [];
      this.nextBunny = 0;
      this.particles = [];
      this.gridDirty = true;
      this.digUntil = 0;
      this.worm = null;
      this.nextWorm = 0;
      this.nextButterfly = 0;
      this.visible = true;
      this.frame = document.createElement('canvas');
      this.fctx = this.frame.getContext('2d');
      this.still = document.createElement('canvas');
      this.sctx = this.still.getContext('2d');

      new ResizeObserver(() => this.resize()).observe(this);
      // pause the critters while the garden is scrolled out of view
      new IntersectionObserver(([e]) => { this.visible = e.isIntersecting; this.kick(); }).observe(this);
      const tools = root.querySelector('.tools');
      this.toolButtons = [...tools.querySelectorAll('button')];
      tools.addEventListener('pointerdown', e => e.stopPropagation());
      tools.addEventListener('pointerenter', () => { this.overTools = true; this.kick(); });
      tools.addEventListener('pointerleave', () => { this.overTools = false; this.kick(); });
      this.toolButtons.forEach(b => b.addEventListener('click', () => { this.mode = b.dataset.mode; }));
      tools.addEventListener('keydown', e => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const i = this.toolButtons.findIndex(b => b.dataset.mode === this._mode), n = this.toolButtons.length;
        const next = this.toolButtons[(i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n];
        this.mode = next.dataset.mode; next.focus();
      });
      this.mode = MODES.includes(this.getAttribute('mode')) ? this.getAttribute('mode') : 'water';

      this.addEventListener('pointermove', e => {
        const prev = this.pointer;
        this.pointer = this.cell(e);
        if (this._mode === 'interact') this.touch(this.pointer, prev, false);
        this.kick();
      });
      this.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { this.pointer = null; this.kick(); } });
      this.addEventListener('pointerdown', e => {
        const at = this.cell(e), now = performance.now();
        this.pointer = at;
        if (e.pointerType !== 'mouse') this.touchUntil = now + 900;
        if (this._mode === 'water') this.water(at, e.pointerType);
        else if (this._mode === 'interact') this.touch(at, null, true);
        else this.dig(at);
        this.kick();
      });
      this.resize();
    }

    get mode() { return this._mode; }
    set mode(m) {
      if (!MODES.includes(m) || m === this._mode) return;
      this._mode = m;
      if (this.toolButtons) this.toolButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
      this.dispatchEvent(new CustomEvent('modechange', { detail: { mode: m }, bubbles: true }));
      this.kick();
    }

    cell(e) {
      const r = this.getBoundingClientRect();
      const k = this.scale / (window.devicePixelRatio || 1);
      return { x: Math.floor((e.clientX - r.left) / k), y: Math.floor((e.clientY - r.top) / k) };
    }

    resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(this.clientWidth * dpr));
      const h = Math.max(1, Math.round(this.clientHeight * dpr));
      this.scale = Math.max(1, Math.round(this.px * dpr));
      this.canvas.width = w; this.canvas.height = h;
      this.cols = Math.ceil(w / this.scale); this.rows = Math.ceil(h / this.scale);
      this.frame.width = this.still.width = this.cols;
      this.frame.height = this.still.height = this.rows;
      this.gridDirty = true;
      this.redrawStill();
      this.kick();
    }

    redrawStill() {
      const c = this.sctx;
      c.fillStyle = this.paper; c.fillRect(0, 0, this.cols, this.rows);
      for (const p of this.plants) if (p.done) this.drawPlant(c, p, 1, Infinity);
    }

    // true when the fully grown plant lies entirely inside the box,
    // clear of the menu and anything in avoid=""
    fits(p) {
      let ok = true;
      const cols = this.cols, rows = this.rows, out = this.keepOut(2);
      const probe = { set fillStyle(v) {}, fillRect(x, y) {
        if (x < 0 || y < 0 || x >= cols || y >= rows) ok = false;
        else for (const r of out) if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) { ok = false; break; }
      } };
      this.drawPlant(probe, { ...p, grow: null }, 1, Infinity);
      return ok;
    }

    drawRows(c, rows, ox, oy, flip = false, w = 0, maxY = Infinity) {
      rows.forEach((r, y) => [...r].forEach((ch, x) => {
        if (ch === ' ') return;
        const gx = ox + (flip ? w - 1 - x : x), gy = oy + y;
        if (gy > maxY) return;
        c.fillStyle = ch === '#' || (ch === ':' && ((gx + gy) & 1) === 0) ? this.ink : this.paper;
        c.fillRect(gx, gy, 1, 1);
      }));
    }

    // where a butterfly sits on top of a bloom
    perchPoint(p) {
      const O = this.stemPoint(p, 1), k = 1 + (p.size - 1) * 0.7, H = p.head.H * k - 1;
      return { x: O.x + H * Math.sin(p.head.tilt), y: O.y - H * Math.cos(p.head.tilt) - 4 };
    }

    // which plant covers each cell (fully grown, at rest); 0 = open ground
    grid() {
      if (!this.gridDirty && this._grid) return this._grid;
      const cols = this.cols, rows = this.rows, g = new Int16Array(cols * rows);
      this.plants.forEach((p, i) => {
        const probe = { set fillStyle(v) {}, fillRect(x, y) { if (x >= 0 && y >= 0 && x < cols && y < rows) g[y * cols + x] = i + 1; } };
        this.drawPlant(probe, { ...p, size: p.grow ? p.grow.to : p.size, swayOff: 0 }, 1, Infinity);
      });
      this._grid = g; this.gridDirty = false;
      return g;
    }

    plantNear(at, r) {
      const g = this.grid();
      for (let d = 0; d <= r; d++) for (let dy = -d; dy <= d; dy++) for (let dx = -d; dx <= d; dx++) {
        const x = at.x + dx, y = at.y + dy;
        if (x < 0 || y < 0 || x >= this.cols || y >= this.rows) continue;
        const id = g[y * this.cols + x];
        if (id && !this.plants[id - 1].dig) return this.plants[id - 1];
      }
      return null;
    }

    unbake(p) { if (p.done) { p.done = false; this.redrawStill(); } }

    burst(x, y, n, power = 1) {
      const now = performance.now();
      for (let i = 0; i < n; i++)
        this.particles.push({ x: x + rand(-2, 2), y, vx: rand(-14, 14) * power, vy: -rand(14, 30) * power, born: now, floor: y });
    }

    // ---------- interact mode
    touch(at, prev, tap) {
      const now = performance.now();
      const moved = prev ? at.x - prev.x : 0;
      const dir = Math.sign(moved) || (Math.random() < 0.5 ? -1 : 1);
      const speed = prev ? Math.min(3, Math.hypot(at.x - prev.x, at.y - prev.y)) : 0;
      const g = this.grid(), r = tap ? 2 : 1, seen = new Set();
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const x = at.x + dx, y = at.y + dy;
        if (x < 0 || y < 0 || x >= this.cols || y >= this.rows) continue;
        const id = g[y * this.cols + x];
        if (id) seen.add(this.plants[id - 1]);
      }
      for (const p of seen) this.swayPlant(p, dir, tap ? 3.2 : 1.4 + speed * 0.5, now);

      for (const b of this.bunnies)
        if (b.state !== 'burrow' && Math.abs(at.x - b.x) <= BUNNY_W / 2 + 1 && at.y >= b.y - BUNNY_H && at.y <= b.y + 1) this.burrow(b, now);
      for (const b of this.butterflies)
        if (!b.flee && Math.hypot(b.x - at.x, b.y - at.y) < (tap ? 8 : 6)) this.flee(b, at, now);
      const w = this.worm;
      if (w && !w.retracting && Math.abs(at.x - (w.x + 1)) <= 3 && at.y >= w.y - 10 && at.y <= w.y + 1) {
        const t = now - w.start, frac = clamp01(Math.min(t / 500, (w.dur - t) / 500));
        w.dur = t + 500 * frac; w.retracting = true;
      }
    }

    swayPlant(p, dir, amp, now) {
      if (p.dig || (p.sway && now - p.sway.start < 350)) return;
      p.sway = { start: now, amp: dir * amp };
      this.unbake(p);
      for (const b of this.butterflies) if (b.perch === p && b.state === 'rest') this.flee(b, { x: b.x - dir * 3, y: b.y + 4 }, now);
      this.kick();
    }

    flee(b, from, now) {
      let dx = b.x - from.x, dy = b.y - from.y - 4;
      const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      Object.assign(b, { flee: true, leaving: true, state: 'fly', perch: null, vx: dx * 20, vy: dy * 20, fx: dx, fy: dy });
      this.nextButterfly = Math.max(this.nextButterfly, now + rand(5000, 9000));
    }

    // ---------- dig mode
    dig(at) {
      const now = performance.now();
      this.digUntil = now + 220;
      const p = this.plantNear(at, 2);
      if (p) {
        p.dig = { start: now }; p.sway = null; p.swayOff = 0;
        this.unbake(p);
        for (const b of this.butterflies) if (b.perch === p) this.flee(b, { x: b.x, y: b.y + 6 }, now);
        this.burst(p.bx, p.by, 12, 1);
      } else this.burst(at.x, at.y, 5, 0.6);
    }

    // is a butterfly centred at (x, y) clear of the menu and avoid="" areas?
    airFree(x, y, out = this.keepOut(1)) {
      return !out.some(r => x + 6 >= r.x0 && x - 6 <= r.x1 && y + 5 >= r.y0 && y - 5 <= r.y1);
    }

    pickTarget(b) {
      const out = this.keepOut(1);
      const perches = this.plants.filter(p => p.done && !p.dig && p !== b.perch && !this.butterflies.some(o => o.perch === p)
                                          && (q => this.airFree(q.x, q.y, out))(this.perchPoint(p)));
      if (perches.length && Math.random() < 0.5) {
        b.perch = perches[Math.floor(Math.random() * perches.length)];
      } else {
        b.perch = null;
        for (let i = 0; i < 20; i++) {
          b.tx = rand(6, this.cols - 6); b.ty = rand(5, this.rows * 0.7);
          if (this.airFree(b.tx, b.ty, out)) break;
        }
      }
    }

    makeButterfly() {
      const left = Math.random() < 0.5;
      const b = { x: left ? -6 : this.cols + 6, y: rand(this.rows * 0.15, this.rows * 0.6), vx: 0, vy: 0,
                  phase: rand(0, 6.28), state: 'fly', perch: null, leaving: false, side: left ? -1 : 1 };
      this.pickTarget(b);
      return b;
    }

    updateButterflies(now, dt) {
      const want = this.plants.length > BUTTERFLIES_AFTER ? Math.min(MAX_BUTTERFLIES, this.plants.length - BUTTERFLIES_AFTER) : 0;
      const active = this.butterflies.filter(b => !b.leaving);
      if (active.length < want && now >= this.nextButterfly) { this.butterflies.push(this.makeButterfly()); this.nextButterfly = now + 1800; }
      active.slice(want).forEach(b => { b.leaving = true; b.state = 'fly'; b.perch = null; });

      for (const b of this.butterflies) {
        if (b.flee) {
          b.vx += b.fx * 30 * dt; b.vy += (b.fy * 30 - 6) * dt;
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.x < -12 || b.x > this.cols + 12 || b.y < -12 || b.y > this.rows + 12) b.gone = true;
          continue;
        }
        if (b.perch && (!this.plants.includes(b.perch) || b.perch.dig)) { b.state = 'fly'; this.pickTarget(b); }
        if (b.state === 'rest') {
          if (now > b.restUntil) { b.state = 'fly'; this.pickTarget(b); }
          continue;
        }
        let tx = b.tx, ty = b.ty;
        if (b.leaving) { tx = b.side < 0 ? -12 : this.cols + 12; ty = b.y - 4; }
        else if (b.perch) { const q = this.perchPoint(b.perch); tx = q.x; ty = q.y; }
        const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy) || 1;
        const speed = Math.min(16, 3 + d * 1.5);
        const k = Math.min(1, dt * 2.2);
        b.vx += (dx / d * speed - b.vx) * k;
        b.vy += (dy / d * speed - b.vy) * k;
        if (!b.leaving && d < 3) {   // ease in for the landing instead of overshooting
          b.x += dx * Math.min(1, dt * 5); b.y += dy * Math.min(1, dt * 5);
          b.vx *= 0.8; b.vy *= 0.8;
        } else { b.x += b.vx * dt; b.y += b.vy * dt; }
        if (b.leaving) { if (b.x < -10 || b.x > this.cols + 10) b.gone = true; }
        else if (d < 0.6) {
          if (b.perch) { b.state = 'rest'; b.x = tx; b.y = ty; b.restUntil = now + rand(2500, 5500); }
          else this.pickTarget(b);
        }
      }
      this.butterflies = this.butterflies.filter(b => !b.gone);
    }

    drawButterflies(c, now) {
      for (const b of this.butterflies) {
        let open, bob = 0;
        if (b.state === 'rest') open = ((now + b.phase * 300) % 1700) < 170;   // the odd slow flap
        else { open = Math.floor(now / (b.flee ? 55 : 110) + b.phase) % 2 === 0; bob = Math.sin(now / 170 + b.phase) * 0.7; }
        this.drawRows(c, open ? BF_OPEN : BF_SHUT, Math.round(b.x) - 5, Math.round(b.y + bob) - 4);
      }
    }

    // can a bunny stand with its feet at (x, y) without touching any flower?
    bunnyFree(x, y, m = 2) {
      const g = this.grid(), cols = this.cols;
      const x0 = Math.round(x - BUNNY_W / 2) - m, x1 = x0 + BUNNY_W - 1 + 2 * m;
      const y0 = Math.round(y) - BUNNY_H + 1 - m, y1 = Math.round(y) + 1;
      if (y0 < 0 || y1 >= this.rows) return false;
      for (const r of this.keepOut()) if (x1 >= r.x0 && x0 <= r.x1 && y1 >= r.y0 && y0 <= r.y1) return false;
      for (let yy = y0; yy <= y1; yy++) for (let xx = Math.max(0, x0); xx <= Math.min(cols - 1, x1); xx++)
        if (g[yy * cols + xx]) return false;
      return true;
    }

    // areas nothing may grow or sit over, in garden cells: the menu, plus page
    // elements named by the avoid attribute (e.g. a clear button)
    keepOut(pad = 1) {
      const h = this.getBoundingClientRect(), k = this.scale / (window.devicePixelRatio || 1);
      const els = [this.shadowRoot.querySelector('.tools')];
      const sel = this.getAttribute('avoid');
      if (sel) try { els.push(...document.querySelectorAll(sel)); } catch (e) {}
      const rects = [];
      for (const el of els) {
        if (!el || !el.offsetWidth) continue;
        const r = el.getBoundingClientRect();
        rects.push({ x0: Math.floor((r.left - h.left) / k) - pad, x1: Math.ceil((r.right - h.left) / k) + pad,
                     y0: Math.floor((r.top - h.top) / k) - pad, y1: Math.ceil((r.bottom - h.top) / k) + pad });
      }
      return rects;
    }

    pathFree(x0, y0, x1, y1) {
      const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0));
      for (let i = 1; i <= n; i++) if (!this.bunnyFree(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, 2)) return false;
      return true;
    }

    // ground lines: the levels flowers are planted at (the bunny's feet go there)
    groundLines() {
      return [...new Set(this.plants.filter(p => !p.dig).map(p => p.by))].filter(y => y - BUNNY_H - 2 >= 0 && y + 2 < this.rows);
    }

    // an open patch along a ground line. With `from`, along the bunny's own line and
    // reachable in a straight hop path; otherwise reachable from either edge.
    bunnySpot(from) {
      const lines = from ? [from.y] : this.groundLines();
      if (!lines.length) return null;
      let fallback = null;
      for (let i = 0; i < 80; i++) {
        const y = lines[Math.floor(Math.random() * lines.length)];
        const x = from ? from.x + rand(-35, 35) : rand(BUNNY_W / 2 + 1, this.cols - BUNNY_W / 2 - 1);
        if (x < BUNNY_W / 2 + 1 || x > this.cols - BUNNY_W / 2 - 1) continue;
        if (!this.bunnyFree(x, y, 3)) continue;
        if (from) { if (this.pathFree(from.x, y, x, y)) return { x, y }; continue; }
        const sides = x < this.cols / 2 ? [-BUNNY_W, this.cols + BUNNY_W] : [this.cols + BUNNY_W, -BUNNY_W];
        for (const sx of sides) if (this.pathFree(sx, y, x, y)) return { x, y, sx };
        fallback = fallback || { x, y, emerge: true };   // no clear lane in: pop up out of the ground
      }
      return from ? null : fallback;
    }

    burrow(b, now, quick = false) {
      if (b.state === 'burrow') return;
      if (b.state === 'hop') { b.x = b.hx1; b.y = b.hy1; }
      // an emerging bunny goes back down from wherever it got to
      const left = b.state === 'emerge' ? BURROW_MS - (b.until - now) : BURROW_MS;
      b.state = 'burrow'; b.until = now + Math.max(200, quick ? Math.min(left, 380) : left);
      b.burrowMs = b.until - now;
      this.burst(b.x, b.y, 10, 0.8);
    }

    updateBunnies(now) {
      const want = this.plants.length > BUNNIES_AFTER ? MAX_BUNNIES : 0;
      const active = this.bunnies.filter(b => b.state !== 'burrow');  // includes emerging
      if (active.length < want && now >= this.nextBunny && !this.bunnies.length) {
        const spot = this.bunnySpot(null);
        if (spot && spot.emerge) {
          this.bunnies.push({ x: spot.x, y: spot.y, tx: spot.x, ty: spot.y, state: 'emerge', until: now + BURROW_MS, face: Math.random() < 0.5 ? 1 : -1 });
          this.burst(spot.x, spot.y, 8, 0.7);
        } else if (spot) this.bunnies.push({ x: spot.sx, y: spot.y, tx: spot.x, ty: spot.y, state: 'pause', until: now, face: spot.sx < 0 ? 1 : -1 });
        this.nextBunny = now + 1500;
      }
      if (active.length > want) active.slice(want).forEach(b => this.burrow(b, now));

      for (const b of this.bunnies) {
        if (b.state === 'burrow') {
          if (now >= b.until) { b.gone = true; this.nextBunny = now + rand(7000, 13000); }
          continue;
        }
        if (b.state === 'emerge') {
          if (now >= b.until) { b.state = 'sit'; b.until = now + rand(5000, 9000); b.nibbleAt = now + rand(500, 1500); }
          continue;
        }
        if (b.state === 'hop') {
          if (now - b.hopStart >= HOP_MS) { b.x = b.hx1; b.y = b.hy1; b.state = 'pause'; b.until = now + rand(160, 380); }
          continue;
        }
        if (b.state === 'sit') {
          // a flower grew into its patch: move somewhere open
          if (!this.bunnyFree(b.x, b.y, 1)) { this.burrow(b, now, true); continue; }
          if (now < b.until) continue;
          const r = Math.random();
          if (r < 0.55) {
            // hop off out of the frame, along a clear lane, and come back later
            const near = b.x < this.cols / 2 ? -BUNNY_W * 1.5 : this.cols + BUNNY_W * 1.5;
            const far = near < 0 ? this.cols + BUNNY_W * 1.5 : -BUNNY_W * 1.5;
            const out = [near, far].find(sx => this.pathFree(b.x, b.y, sx, b.y));
            if (out !== undefined) { b.tx = out; b.ty = b.y; b.exiting = true; b.state = 'pause'; continue; }
          }
          if (r < 0.85) {
            const spot = this.bunnySpot(b);
            if (spot) { b.tx = spot.x; b.ty = spot.y; b.state = 'pause'; continue; }
          }
          b.until = now + rand(4000, 8000);   // stay put a while longer
          continue;
        }
        if (now < b.until) continue;
        const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
        if (d < 0.5) {
          if (b.exiting) { b.gone = true; this.nextBunny = now + rand(6000, 12000); continue; }
          b.state = 'sit'; b.until = now + rand(6000, 12000);
          b.nibbleAt = now + rand(500, 1500);
          if (Math.random() < 0.35) b.face = -b.face;   // sometimes turn to look around
          continue;
        }
        const step = Math.min(1, HOP_LEN * rand(0.8, 1.15) / d);
        const nx = b.x + dx * step, ny = b.y;
        if (!this.pathFree(b.x, b.y, nx, ny)) {   // something grew in the way
          const spot = this.bunnySpot(b);
          if (spot) { b.tx = spot.x; b.ty = spot.y; b.until = now + 150; } else this.burrow(b, now);
          continue;
        }
        b.face = dx >= 0 ? 1 : -1;
        b.hx0 = b.x; b.hy0 = b.y; b.hx1 = nx; b.hy1 = ny;
        b.hopStart = now; b.state = 'hop';
      }
      this.bunnies = this.bunnies.filter(b => !b.gone);
    }

    drawBunnies(c, now) {
      for (const b of this.bunnies) {
        let rows = BUNNY_SIT, x = b.x, y = b.y, sink = 0;
        if (b.state === 'hop') {
          const t = clamp01((now - b.hopStart) / HOP_MS);
          x = b.hx0 + (b.hx1 - b.hx0) * t;
          y = b.hy0 + (b.hy1 - b.hy0) * t - Math.sin(Math.PI * t) * HOP_ARC;
          rows = t > 0.2 && t < 0.8 ? BUNNY_HOP : BUNNY_SIT;
        } else if (b.state === 'burrow' || b.state === 'emerge') {
          const t = clamp01(1 - (b.until - now) / (b.state === 'burrow' ? b.burrowMs || BURROW_MS : BURROW_MS));
          sink = Math.round((b.state === 'burrow' ? easeOut(t) : 1 - easeOut(t)) * (BUNNY_H + 1));
          rows = b.state === 'burrow' ? BUNNY_NIB : BUNNY_SIT;
        } else if (b.state === 'sit' && now > b.nibbleAt) {
          // nibble on and off while sitting
          rows = Math.floor((now - b.nibbleAt) / 260) % 4 < 2 ? BUNNY_NIB : BUNNY_SIT;
          if (now - b.nibbleAt > 2600) b.nibbleAt = now + rand(1200, 3000);
        }
        const w = Math.max(...rows.map(r => r.length)), gy = Math.round(b.y);
        const under = b.state === 'burrow' || b.state === 'emerge';
        this.drawRows(c, rows, Math.round(x - w / 2), Math.round(y) - rows.length + 1 + sink, b.face < 0, w, under ? gy : Infinity);
        if (under) {
          // a little dithered mound of dirt where it went down
          const dot = (xx, yy) => { c.fillStyle = this.ink; c.fillRect(xx, yy, 1, 1); };
          const cx = Math.round(b.x);
          for (let dx = -8; dx <= 8; dx++) if (((cx + dx + gy) & 1) === 0 || Math.abs(dx) < 5) dot(cx + dx, gy);
          for (let dx = -5; dx <= 5; dx++) if (((cx + dx + gy - 1) & 1) === 0) dot(cx + dx, gy - 1);
        }
      }
    }

    updateWorm(now) {
      if (this.plants.length <= WORMS_AFTER) { this.nextWorm = now + rand(1500, 4000); return; }
      if (this.worm) { if (now > this.worm.start + this.worm.dur) { this.worm = null; this.nextWorm = now + rand(6000, 14000); } return; }
      if (now < this.nextWorm) return;
      const homes = this.plants.filter(p => p.done);
      for (let i = 0; i < 6 && homes.length; i++) {
        const p = homes[Math.floor(Math.random() * homes.length)];
        const x = p.bx + (Math.random() < 0.5 ? -1 : 1) * Math.round(rand(6, 10)), y = p.by;
        if (x >= 3 && x <= this.cols - 6 && y - 10 >= 0 && y + 1 < this.rows) {
          this.worm = { x, y, start: now, dur: rand(3500, 5500), phase: rand(0, 6.28) };
          return;
        }
      }
      this.nextWorm = now + 2000;
    }

    drawWorm(c, now) {
      const w = this.worm; if (!w) return;
      const t = now - w.start, H = 7;
      const h = Math.round(H * clamp01(Math.min(t / 500, (w.dur - t) / 500)));
      const dot = (x, y, on) => { c.fillStyle = on ? this.ink : this.paper; c.fillRect(x, y, 1, 1); };
      // a little dithered mound with a hole in it
      for (let dx = -3; dx <= 5; dx++) if (((w.x + dx + w.y) & 1) === 0) dot(w.x + dx, w.y, true);
      for (let dx = -1; dx <= 3; dx++) if (((w.x + dx + w.y - 1) & 1) === 0) dot(w.x + dx, w.y - 1, true);
      dot(w.x, w.y, true); dot(w.x + 1, w.y, true); dot(w.x + 2, w.y, true);
      // smooth body that leans and sways more towards the head
      const lean = Math.sin(now / 330 + w.phase) * 1.6;
      for (let r = 1; r <= h; r++) {
        const x = w.x + 1 + Math.round(lean * ((r - 1) / (H - 1)) ** 1.6), y = w.y - r;
        if (r === h && h >= 3) {
          // head: a little wider, with an eye on the side it's leaning towards
          const e = lean >= 0 ? x + 1 : x;
          dot(e - 1, y, true); dot(e, y, false); dot(e + 1, y, true);
          dot(x, y - 1, true); dot(x + 1, y - 1, true);
        } else { dot(x, y, true); dot(x + 1, y, true); }
      }
    }

    clear() {
      this.plants = []; this.drops = []; this.splashes = []; this.butterflies = []; this.worm = null; this.bunnies = []; this.particles = [];
      this.gridDirty = true;
      this.redrawStill(); this.kick();
    }

    // the flower the falling water hits first: anything drawn in the stream
    // (from the spout down to the landing spot, a few cells wide) counts
    hitPlant(at) {
      const top = at.y - CAN_IDLE.lift, bottom = at.y + 2;
      let best = null, bestY = Infinity;
      for (let i = this.plants.length - 1; i >= 0; i--) {   // newest first, as it's drawn on top
        const p = this.plants[i];
        if (p.dig) continue;
        let hitY = Infinity;
        const probe = { set fillStyle(v) {}, fillRect(x, y) {
          if (Math.abs(x - at.x) <= 2 && y >= top && y <= bottom && y < hitY) hitY = y;
        } };
        this.drawPlant(probe, { ...p, size: p.grow ? p.grow.to : p.size }, 1, Infinity);
        if (hitY < bestY) { bestY = hitY; best = p; }
      }
      return best ? { plant: best, y: bestY } : null;
    }

    water(at, type) {
      const now = performance.now();
      this.pointer = at;
      if (type !== 'mouse') this.touchUntil = now + 900;
      this.pourUntil = now + 480;
      for (let i = 0; i < 6; i++) this.drops.push({ x: at.x + Math.round(rand(-1, 1)), y: at.y - 3 - i * 1.6, top: at.y - 3, land: at.y });

      const found = this.hitPlant(at), hit = found && found.plant;
      if (found) for (const d of this.drops) if (d.land === at.y) d.land = Math.max(d.top + 1, found.y);
      if (hit) {
        if (hit.level < MAX_LEVEL) {
          const start = now + (this.reduced ? -GROW_MORE_MS : GROW_DELAY);
          const level = hit.level + 1, size = 1 + 0.22 * level;
          const leaves = level % 2 === 0 ? [...hit.leaves, this.makeLeaf(start, hit.leaves)] : hit.leaves;
          if (this.fits({ ...hit, size, leaves })) {   // too big for the box? leave it as it is
            hit.level = level;
            hit.leaves = leaves;
            hit.grow = { from: hit.size, to: size, start };
            this.gridDirty = true;
            for (const bn of this.bunnies) if (bn.state !== 'burrow' && !this.bunnyFree(bn.state === 'hop' ? bn.hx1 : bn.x, bn.y, 1)) this.burrow(bn, now, true);
            if (hit.done) { hit.done = false; this.redrawStill(); }
          }
        }
      } else {
        // try a few random variations; plant nothing if none fits completely
        for (let i = 0; i < 8; i++) {
          const np = this.makePlant(at.x, at.y, now + (this.reduced ? -GROW_MS : GROW_DELAY));
          if (!this.fits(np)) continue;
          this.plants.push(np);
          this.gridDirty = true;
          for (const bn of this.bunnies) if (bn.state !== 'burrow' && !this.bunnyFree(bn.state === 'hop' ? bn.hx1 : bn.x, bn.y, 1)) this.burrow(bn, now, true);
          if (this.plants.length > this.maxFlowers) { this.plants.shift(); this.redrawStill(); }
          break;
        }
      }
      this.kick();
    }

    makeLeaf(born, existing = []) {
      const last = existing[existing.length - 1];
      return {
        born,
        at: last ? Math.min(0.8, last.at + rand(0.12, 0.22)) : rand(0.25, 0.55),
        side: last ? -last.side : (Math.random() < 0.5 ? -1 : 1),
        len: rand(10, 17) * FLOWER_SCALE, w: rand(1.8, 2.4) * Math.sqrt(FLOWER_SCALE), ang: rand(0.55, 0.95),
      };
    }

    makePlant(bx, by, start) {
      const k = FLOWER_SCALE;
      const stemH = Math.round(rand(18, 34) * k);
      const lean = rand(-5, 5) * k;
      const W = rand(12, 20) * k, H = rand(9, 13) * k;
      return {
        bx, by, start, done: false, stemH, lean, size: 1, level: 0, grow: null,
        bend: rand(-4, 4) * k,
        head: { W, H, lobes: 2 + Math.floor(rand(0, 3)), phase: rand(0, Math.PI * 2), amp: rand(1.4, 2.8) * k, tilt: rand(-0.45, 0.45) + lean * 0.05 },
        leaves: Math.random() < 0.8 ? [this.makeLeaf(null)] : [],
      };
    }

    stemPoint(p, t) {
      const x0 = p.bx + 0.5, y0 = p.by + 0.5;
      const sh = p.stemH * p.size;
      const sw = p.swayOff || 0;
      const x2 = x0 + (p.lean + sw) * p.size, y2 = y0 - sh, x1 = x0 + p.bend + sw * 0.25 * p.size, y1 = y0 - sh * 0.5;
      const m = 1 - t;
      return { x: m * m * x0 + 2 * m * t * x1 + t * t * x2, y: m * m * y0 + 2 * m * t * y1 + t * t * y2 };
    }

    // ---------- plant rasteriser
    drawPlant(c, p, prog, now) {
      const ink = this.ink, paper = this.paper;
      const dot = (x, y, on) => { c.fillStyle = on ? ink : paper; c.fillRect(x, y, 1, 1); };
      const chk = (x, y) => ((x + y) & 1) === 0;

      // dithered shadow at the base
      const sh = clamp01(prog * 3);
      if (sh > 0) {
        const rx = 6 * FLOWER_SCALE * sh * Math.min(1.7, p.size);
        for (let dy = 0; dy <= 1; dy++) for (let dx = -7; dx <= 6; dx++) {
          const e = ((dx + 0.5) / rx) ** 2 + (dy / 1.6) ** 2;
          const x = p.bx + dx, y = p.by + dy;
          if (e < 1 && (chk(x, y) || (Math.abs(dx) < 2 && dy === 0))) dot(x, y, true);
        }
      }

      // stem
      const s = easeOut(clamp01(prog / 0.55));
      if (s <= 0) return;
      const n = Math.ceil(p.stemH * p.size * 3);
      const stem = () => {
        for (let i = 0; i <= n; i++) {
          const t = (i / n) * s, q = this.stemPoint(p, t);
          const x = Math.floor(q.x), y = Math.floor(q.y);
          dot(x, y, true);
          if (t < 0.4 || (p.size > 1.6 && t < 0.7)) dot(x + 1, y, true);
        }
      };
      stem();

      // leaves
      for (const L0 of p.leaves) {
        if (s <= L0.at) continue;
        const l = L0.born == null ? easeOut(clamp01((prog - 0.3) / 0.4)) : easeOut(clamp01((now - L0.born) / GROW_MORE_MS));
        const B = this.stemPoint(p, L0.at);
        const dir = { x: L0.side * Math.sin(L0.ang), y: -Math.cos(L0.ang) };
        const L = L0.len * l * Math.sqrt(p.size), w = L0.w * (0.5 + 0.5 * l);
        if (L > 1) {
          const f = (x, y) => {
            const dx = x + 0.5 - B.x, dy = y + 0.5 - B.y;
            const a = dx * dir.x + dy * dir.y, b = -dx * dir.y + dy * dir.x;
            if (a < 0 || a > L) return null;
            const hw = w * Math.pow(Math.sin(Math.PI * a / L), 0.7);
            return Math.abs(b) <= hw ? { a, b } : null;
          };
          const R = Math.ceil(L + 3);
          for (let y = Math.floor(B.y) - R; y <= B.y + R; y++) for (let x = Math.floor(B.x) - R; x <= B.x + R; x++) {
            const q = f(x, y); if (!q) continue;
            const edge = !f(x + 1, y) || !f(x - 1, y) || !f(x, y + 1) || !f(x, y - 1);
            if (edge || Math.abs(q.b) < 0.5) dot(x, y, true);
            else dot(x, y, false);
          }
        }
      }

      if (p.leaves.length) stem(); // keep the stem on top of leaf bases

      // flower head
      const hp = clamp01((prog - 0.5) / 0.5);
      if (hp <= 0) return;
      const h = easeBack(hp), hd = p.head;
      const O = this.stemPoint(p, s);
      const k = 1 + (p.size - 1) * 0.7;
      const W = hd.W * k * (0.35 + 0.65 * h), H = hd.H * k * (0.5 + 0.5 * h), amp = hd.amp * k * clamp01(h);
      const tilt = hd.tilt + (p.swayOff || 0) * 0.07;
      const r = W / 2, depth = H * 0.45, cos = Math.cos(tilt), sin = Math.sin(tilt);
      const top = u => { const s2 = (u + r) / (2 * r); return -H * (1 - 0.22 * (u / r) ** 2) + amp * (0.5 + 0.5 * Math.cos(2 * Math.PI * hd.lobes * s2 + hd.phase)); };
      const bot = u => -depth * (1 - Math.sqrt(Math.max(0, 1 - (u / r) ** 2))) + 0.6;
      const local = (x, y) => { const dx = x + 0.5 - O.x, dy = y + 0.5 - O.y; return { u: dx * cos + dy * sin, v: -dx * sin + dy * cos }; };
      const inside = (x, y) => { const { u, v } = local(x, y); return Math.abs(u) < r && v >= top(u) && v <= bot(u); };

      // petal creases run from the base to each valley in the rim
      const creases = [];
      for (let k = -2; k <= hd.lobes + 2; k++) {
        const s2 = (2 * Math.PI * k - hd.phase) / (2 * Math.PI * hd.lobes);
        if (s2 > 0.14 && s2 < 0.86) { const u = s2 * 2 * r - r; creases.push({ u, v: top(u) * 0.8 }); }
      }
      const segDist = (u, v, cx, cy) => {
        const ax = 0, ay = -depth * 0.15, bx = cx - ax, by = cy - ay;
        const t = clamp01(((u - ax) * bx + (v - ay) * by) / (bx * bx + by * by));
        return Math.hypot(u - ax - bx * t, v - ay - by * t);
      };

      const R = Math.ceil(Math.max(W, H) + 3);
      for (let y = Math.floor(O.y) - R; y <= O.y + R; y++) for (let x = Math.floor(O.x) - R; x <= O.x + R; x++) {
        if (!inside(x, y)) continue;
        const edge = !inside(x + 1, y) || !inside(x - 1, y) || !inside(x, y + 1) || !inside(x, y - 1);
        if (edge) { dot(x, y, true); continue; }
        const { u, v } = local(x, y);
        const t = (v - top(u)) / (bot(u) - top(u));
        let on = false;
        if (bot(u) - v < 1.6) on = true;
        else if (t > 0.45) on = chk(x, y);
        else if (h > 0.6 && creases.some(c2 => segDist(u, v, c2.u, c2.v) < 0.55)) on = true;
        dot(x, y, on);
      }
    }

    drawCursor(c, now) {
      const show = this.pointer && !this.overTools && (this.matches(':hover') || now < (this.touchUntil || 0));
      if (!show) return;
      const { x: px, y: py } = this.pointer;
      if (this._mode === 'interact') { this.drawRows(c, HAND, px - 1, py); return; }
      if (this._mode === 'dig') { this.drawRows(c, TROWEL, px, py - 12 + (now < this.digUntil ? 2 : 0)); return; }
      const spr = now < this.pourUntil ? CAN_POUR : CAN_IDLE;
      const ox = px - spr.tip.x, oy = py - spr.lift - spr.tip.y;
      for (const { x, y, c: ch } of spr.cells) {
        const gx = ox + x, gy = oy + y;
        const on = ch === '#' || (ch === ':' && ((gx + gy) & 1) === 0);
        c.fillStyle = on ? this.ink : this.paper;
        c.fillRect(gx, gy, 1, 1);
      }
    }

    kick() { if (!this.raf) this.raf = requestAnimationFrame(t => this.tick(t)); }

    tick(now) {
      this.raf = 0;
      const dt = Math.min(50, now - (this.last || now)); this.last = now;
      const c = this.fctx;
      c.drawImage(this.still, 0, 0);
      let busy = false;

      const dug = [];
      for (const p of this.plants) {
        if (p.done) continue;
        if (p.dig) {
          const t = (now - p.dig.start) / DIG_MS;
          if (t >= 1) dug.push(p);
          else { this.drawPlant(c, p, 1 - t * t, Infinity); busy = true; }
          continue;
        }
        if (p.sway) {
          const t = (now - p.sway.start) / 1000;
          if (t > 2.2) { p.sway = null; p.swayOff = 0; }
          else p.swayOff = p.sway.amp * Math.sin(t * 2 * Math.PI / 0.8) * Math.exp(-t / 0.55);
        }
        const prog = clamp01((now - p.start) / GROW_MS);
        if (p.grow) {
          const t = clamp01((now - p.grow.start) / GROW_MORE_MS);
          p.size = p.grow.from + (p.grow.to - p.grow.from) * (t > 0 ? easeBack(t) : 0);
          if (t >= 1) { p.size = p.grow.to; p.grow = null; }
        }
        const leafing = p.leaves.some(l => l.born != null && now - l.born < GROW_MORE_MS);
        if (prog >= 1 && !p.grow && !leafing && !p.sway) { p.done = true; this.drawPlant(this.sctx, p, 1, Infinity); this.drawPlant(c, p, 1, Infinity); }
        else { this.drawPlant(c, p, prog, now); busy = true; }
      }

      if (dug.length) { this.plants = this.plants.filter(p => !dug.includes(p)); this.gridDirty = true; }

      const critters = this.plants.length > BUTTERFLIES_AFTER || this.butterflies.length > 0 || this.bunnies.length > 0;
      if (critters) {
        this.updateWorm(now);
        this.updateButterflies(now, dt / 1000);
        this.updateBunnies(now);
        this.drawWorm(c, now);
        this.drawBunnies(c, now);
        busy = true;
      }

      c.fillStyle = this.ink;
      this.drops = this.drops.filter(d => {
        d.y += dt * 0.045;
        if (d.y >= d.land) { this.splashes.push({ x: d.x, y: d.land, t: now }); return false; }
        if (d.y >= d.top) c.fillRect(d.x, Math.floor(d.y), 1, 2);
        return true;
      });
      this.splashes = this.splashes.filter(s => {
        const a = now - s.t; if (a > 140) return false;
        const o = a < 70 ? 1 : 2;
        c.fillRect(s.x - o, s.y - 1, 1, 1); c.fillRect(s.x + o, s.y - 1, 1, 1);
        return true;
      });
      const pdt = dt / 1000;
      this.particles = this.particles.filter(q => {
        q.vy += 110 * pdt; q.x += q.vx * pdt; q.y += q.vy * pdt;
        if (now - q.born > 900 || (q.vy > 0 && q.y > q.floor)) return false;
        c.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
        return true;
      });
      if (this.drops.length || this.splashes.length || this.particles.length || now < this.pourUntil || now < this.digUntil || now < (this.touchUntil || 0)) busy = true;

      this.drawButterflies(c, now);
      this.drawCursor(c, now);

      const ctx = this.ctx;
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = this.paper; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.drawImage(this.frame, 0, 0, this.cols * this.scale, this.rows * this.scale);
      if (busy && this.visible) this.kick();
    }
  }
  customElements.define('pixel-garden', PixelGarden);
})();
</script>
<script>
  // a hint for the current tool, which fades after you use it
  (() => {
    const garden = document.querySelector('pixel-garden'), hint = document.getElementById('garden-hint');
    const text = {
      water: 'click to start watering',
      interact: 'brush the flowers, or touch a critter',
      dig: 'click a flower to dig it up',
    };
    garden.addEventListener('modechange', e => { hint.textContent = text[e.detail.mode]; hint.classList.remove('hidden'); });
    garden.addEventListener('pointerdown', () => hint.classList.add('hidden'));
  })();
</script>
</body>
</html>
